version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: us-west-2
    APP_REPOSITORY_URI: 895735450791.dkr.ecr.us-west-2.amazonaws.com/ecllm_app

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin 895735450791.dkr.ecr.us-west-2.amazonaws.com
      - echo Logging in to Docker Hub...
      - aws s3 cp s3://ariadnelabs-admin/docker.key docker.key
      - docker login --username ssrinathal --password-stdin < docker.key
      - rm -f docker.key
      - COMMIT_HASH=$(echo "${CODEBUILD_RESOLVED_SOURCE_VERSION:-latest}" | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH:-latest}
      - echo Building image tag "$IMAGE_TAG"

  build:
    commands:
      - echo Build started on `date`
      - echo Building the Next.js production image...
      - |
        docker build \
          --build-arg NEXT_PUBLIC_ADMIN_EMAILS="${NEXT_PUBLIC_ADMIN_EMAILS:-}" \
          --tag "$APP_REPOSITORY_URI:$IMAGE_TAG" \
          --tag "$APP_REPOSITORY_URI:latest" \
          .
      - echo Building the database migration image...
      - |
        docker build \
          --target migration \
          --tag "$APP_REPOSITORY_URI:migration-$IMAGE_TAG" \
          --tag "$APP_REPOSITORY_URI:migration-latest" \
          .

  post_build:
    commands:
      - echo Build completed on `date`
      - docker push "$APP_REPOSITORY_URI:$IMAGE_TAG"
      - docker push "$APP_REPOSITORY_URI:latest"
      - docker push "$APP_REPOSITORY_URI:migration-$IMAGE_TAG"
      - docker push "$APP_REPOSITORY_URI:migration-latest"
      - printf '[{"name":"ecllm_app","imageUri":"%s"},{"name":"ecllm_migrate","imageUri":"%s"}]' "$APP_REPOSITORY_URI:$IMAGE_TAG" "$APP_REPOSITORY_URI:migration-$IMAGE_TAG" > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
    - ecs_task_definition.json

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    client_max_body_size 10M;

    # Upstream — Next.js standalone container
    upstream next_app {
        server next:3000;
    }

    server {
        listen 80;
        server_name _;

        # Healthcheck used by docker-compose
        location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }

        # Static assets served directly from Next.js (immutable, hashed)
        location /_next/static/ {
            proxy_pass http://next_app;
            proxy_set_header Host $host;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location /documents/ {
            proxy_pass http://next_app;
            proxy_set_header Host $host;
        }

        location /favicon.svg {
            proxy_pass http://next_app;
        }

        # API + everything else → Next.js
        location / {
            proxy_pass http://next_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';
        }

        # SSE-friendly overrides (Phase 1b will introduce /api/.../stream endpoints)
        location ~ ^/api/.+/stream$ {
            proxy_pass http://next_app;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 24h;
            chunked_transfer_encoding on;
        }
    }
}

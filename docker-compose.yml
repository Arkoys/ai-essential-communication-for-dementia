services:
  # Postgres 16 + pgvector for embeddings (RAG) and Better Auth tables.
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dementia_coach}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Migrator — runs once on startup, applies Drizzle migrations + ensures pgvector.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: node --import tsx scripts/migrate.ts
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-dementia_coach}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Next.js dev server.
  next:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    command: sh -c "npm run db:migrate && npm run dev"
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-dementia_coach}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      # Comma-separated admin emails. Both server-side (lib/admin.ts) and
      # client-side (lib/auth-client.ts) check this list.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      NEXT_PUBLIC_ADMIN_EMAILS: ${NEXT_PUBLIC_ADMIN_EMAILS:-}
      # Server-side LLM provider keys — read by /api/* proxies. Never exposed
      # to the client (no NEXT_PUBLIC_ prefix). The MiniMax provider was
      # removed in this build; only Harvard and Gemini are supported.
      LLM_PROVIDER: ${LLM_PROVIDER:-harvard}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      HARVARD_OPENAI_KEY: ${HARVARD_OPENAI_KEY:-}
      HARVARD_OPENAI_BASE_URL: ${HARVARD_OPENAI_BASE_URL:-https://go.apis.huit.harvard.edu/ais-openai-direct/v2/}
      HARVARD_MODEL: ${HARVARD_MODEL:-gpt-5.5}
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:

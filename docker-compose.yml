version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - VITE_PORT=3000
      # Firebase
      - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}
      - VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}
      - VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}
      - VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET}
      - VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID}
      - VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID}
      - VITE_FIREBASE_FIRESTORE_DATABASE_ID=${VITE_FIREBASE_FIRESTORE_DATABASE_ID:-(default)}
      - VITE_FIREBASE_MEASUREMENT_ID=${VITE_FIREBASE_MEASUREMENT_ID}
      # LLM Providers
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
      - MINIMAX_MODEL=${MINIMAX_MODEL:-MiniMax-Text-01}
      - MINIMAX_API_BASE_URL=${MINIMAX_API_BASE_URL:-https://api.minimaxi.chat}
      - MINIMAX_API_PATH=${MINIMAX_API_PATH:-/v1/chat/completions}
      # Harvard HUIT OpenAI Direct v2
      - HARVARD_OPENAI_KEY=${HARVARD_OPENAI_KEY}
      - HARVARD_OPENAI_BASE_URL=${HARVARD_OPENAI_BASE_URL:-https://go.apis.huit.harvard.edu/ais-openai-direct/v2/}
      - HARVARD_MODEL=${HARVARD_MODEL:-gpt-4o-mini}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/dist
    restart: unless-stopped

  # Optional: Firebase Emulator for local development
  # Uncomment to use Firebase Emulator Suite
  # firebase-emulator:
  #   image: if再来/emulator:latest
  #   ports:
  #     - "4000:4000"
  #     - "9099:9099"
  #     - "8080:8080"
  #     - "5001:5001"
  #     - "5002:5002"
  #   environment:
  #     - FIREBASE_TOKEN=${FIREBASE_TOKEN}
  #   volumes:
  #     - ./firebase-export:/opt/firebase-exports

services:
  # Backend proxy service for Harvard API
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "3001:3001"
    environment:
      # Harvard HUIT OpenAI Direct v2 - API key kept server-side only
      - HARVARD_OPENAI_KEY=${HARVARD_OPENAI_KEY}
      - HARVARD_OPENAI_BASE_URL=${HARVARD_OPENAI_BASE_URL:-https://go.apis.huit.harvard.edu/ais-openai-direct/v2/}
      - PORT=3001
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend Vite development server
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - VITE_PORT=3000
      # Use backend proxy for Harvard API (server-side key)
      # In Docker Compose, use the backend service name
      - VITE_API_PROXY_URL=http://backend:3001
      # Firebase
      - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}
      - VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}
      - VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}
      - VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET}
      - VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID}
      - VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID}
      - VITE_FIREBASE_FIRESTORE_DATABASE_ID=${VITE_FIREBASE_FIRESTORE_DATABASE_ID:-(default)}
      - VITE_FIREBASE_MEASUREMENT_ID=${VITE_FIREBASE_MEASUREMENT_ID}
      # LLM Providers
      - VITE_LLM_PROVIDER=${VITE_LLM_PROVIDER:-openai}
      - VITE_GEMINI_API_KEY=${VITE_GEMINI_API_KEY}
      - VITE_OPENAI_API_KEY=${VITE_OPENAI_API_KEY}
      - VITE_OPENAI_BASE_URL=${VITE_OPENAI_BASE_URL}
      - VITE_MINIMAX_API_KEY=${VITE_MINIMAX_API_KEY}
      - VITE_MINIMAX_MODEL=${VITE_MINIMAX_MODEL}
      - VITE_MINIMAX_API_BASE_URL=${VITE_MINIMAX_API_BASE_URL}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/dist
    restart: unless-stopped
    depends_on:
      - backend

  # Optional: Firebase Emulator for local development
  # Uncomment to use Firebase Emulator Suite
  # firebase-emulator:
  #   image: if再来/emulator:latest
  #   ports:
  #     - "4000:4000"
  #     - "9099:9099"
  #     - "8080:8080"
  #     - "5001:5001"
  #     - "5002:5002"
  #   environment:
  #     - FIREBASE_TOKEN=${FIREBASE_TOKEN}
  #   volumes:
  #     - ./firebase-export:/opt/firebase-exports
